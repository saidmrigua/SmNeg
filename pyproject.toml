[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smneg"
dynamic = ["version"]
description = "Film negative inversion for camera scanning (RAW/TIFF to positive), with a Frontier-style color workflow."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Said Mrigua" }]
keywords = ["film", "negative", "scanning", "inversion", "photography", "raw"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "PySide6>=6.5",
    "rawpy>=0.18",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
    "tifffile>=2023.1",
]

[project.urls]
Homepage = "https://github.com/saidmrigua/SmNeg"
Issues = "https://github.com/saidmrigua/SmNeg/issues"

[project.optional-dependencies]
tiff = ["tifffile>=2023.1"]   # kept for compatibility: tifffile is now a core dependency
dev = ["pytest>=7", "pyflakes"]

[project.scripts]
smneg = "smneg.app:main"

[tool.setuptools.dynamic]
version = { attr = "smneg.__version__" }   # single source: src/smneg/__init__.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
smneg = ["assets/*"]
